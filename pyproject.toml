[project]
name = "dhpe-pkpd"
version = "0.2.0"
description = "Pharmacokinetic/pharmacodynamic (PK/PD) modeling and simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy>=1.15.3",
    "matplotlib>=3.10.1",
    "plotly>=6.0.1",
    "pandas>=2.2.3",
    "sbmlutils>=0.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
